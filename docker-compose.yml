version: "3.8"

services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: demotemple
    volumes:
      - ./docker/mysqldata:/var/lib/mysql
      - ./docker/mysql/createDevDB.sql:/docker-entrypoint-initdb.d/init1.sql

  php:
    build:
      context: .
      dockerfile: ./docker/dockerfiles/DockerfilePHP
      args:
        buildno: 1.0
    ports:
      - 8000:80
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    depends_on:
      - "db"

  # phpmyadmin:
  #   image: phpmyadmin/phpmyadmin:latest
  #   restart: always
  #   environment:
  #     PMA_HOST: db
  #     PMA_USER: root
  #     PMA_PASSWORD: sq1dev
  #   ports:
  #     - "8086:80"

  adminer:
    image: adminer:4.8.1
    restart: always
    ports:
      - 8080:8080
    depends_on:
      - "db"
